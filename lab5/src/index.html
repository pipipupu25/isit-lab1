<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Управление заявками на ремонт</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div class="container">
    <h1>Система управления заявками на ремонт</h1>

    <!-- Форма создания заявки -->
    <section class="card">
      <h2>Новая заявка на ремонт</h2>
      <form id="task-form">
        <div class="form-group">
          <label for="task-title">Тема / Описание поломки:</label>
          <input type="text" id="task-title" placeholder="Например: Протекает кран в каб. 104">
          <div id="title-error" class="error-message hidden">Тема должна быть не короче 3 символов!</div>
        </div>

        <div class="form-group">
          <label for="task-priority">Приоритет:</label>
          <select id="task-priority">
            <option value="low">Низкий</option>
            <option value="medium" selected>Обычный</option>
            <option value="high">Срочный</option>
          </select>
        </div>

        <button type="submit" id="btn-submit">Отправить заявку</button>
      </form>
    </section>

    <!-- Фильтры и поиск -->
    <section class="card">
      <h2>Список заявок (<span id="task-count">0</span>)</h2>
      
      <div class="controls">
        <div class="control-group">
          <label for="filter-status">Статус:</label>
          <select id="filter-status">
            <option value="">Все статусы</option>
            <option value="in_progress">В работе</option>
            <option value="done">Завершено</option>
          </select>
        </div>

        <div class="control-group">
          <label for="search-input">Поиск:</label>
          <input type="text" id="search-input" placeholder="Поиск по названию...">
        </div>

        <button id="btn-load">Загрузить с сервера</button>
      </div>

      <!-- Область статусов загрузки -->
      <div id="status-message" class="info-message hidden"></div>

      <!-- Таблица заявок -->
      <table id="tasks-table">
        <thead>
          <tr>
            <th>ID</th>
            <th>Тема заявки</th>
            <th>Приоритет</th>
            <th>Статус</th>
            <th>Действия</th>
          </tr>
        </thead>
        <tbody id="task-body">
          <!-- Строки генерируются через JS -->
        </tbody>
      </table>
    </section>
  </div>

  <script src="js/mock-data.js"></script>
  <script src="js/mock-api.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
